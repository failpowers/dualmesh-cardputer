; DualMesh env override for Meshtastic on Cardputer ADV.
;
; INSTALL (see ../README.md "Building" for the full sequence):
;   1. mkdir -p <meshtastic checkout>/variants/esp32s3/m5stack_cardputer_adv_dualmesh
;   2. cp variants/esp32s3/m5stack_cardputer_adv/{pins_arduino.h,variant.h} \
;        <meshtastic checkout>/variants/esp32s3/m5stack_cardputer_adv_dualmesh/
;      (copy the STOCK files as-is — this new folder is a copy of the upstream variant, not a
;      from-scratch redefinition, so it stays correct as upstream evolves; only the .ini and the
;      two small dualmesh headers below are new)
;   3. cp ../../common/dualmesh_ota.h ../../common/board_pins_cardputer_adv.h \
;        ../../partitions_dualmesh.csv \
;        <meshtastic checkout>/variants/esp32s3/m5stack_cardputer_adv_dualmesh/
;   4. cp platformio_dualmesh_env.ini \
;        <meshtastic checkout>/variants/esp32s3/m5stack_cardputer_adv_dualmesh/platformio.ini
;   5. apply 0001-add-return-to-launcher-hook.patch inside the meshtastic checkout (git apply)
;   6. pio run -e m5stack-cardputer-adv-dualmesh
;
; Everything here is additive — it extends the stock, upstream-maintained m5stack-cardputer-adv
; env rather than redefining it, so `git pull` on your meshtastic checkout keeps working normally
; and this overlay only needs to change if the return-to-launcher hunk's line numbers drift (see
; the patch file) or if upstream renames the base env.

[env:m5stack-cardputer-adv-dualmesh]
extends = env:m5stack-cardputer-adv
; Meshtastic's own upstream `platform =` (in variants/esp32/esp32-common.ini) points at a GitHub
; *archive zip* of their pioarduino fork (meshtastic/pioarduino-platform-espressif32); that exact
; codeload.github.com zip URL 403'd in the sandbox this was built in, while `git clone` of the
; same repo worked fine — so this overrides just the transport, not the actual platform commit,
; by cloning the identical branch via git instead. On an unrestricted machine you can almost
; certainly delete this override and inherit the stock env's platform line as-is.
platform = https://github.com/meshtastic/pioarduino-platform-espressif32.git#55.03.311
; esp32_common.ini forces platform_packages = platformio/tool-mklittlefs@1.203.210628 (a specific
; official-PlatformIO-registry build); that registry is what's blocked in this sandbox, and the
; pioarduino platform this env now uses doesn't declare tool-mklittlefs at all (newer esp-idf/
; arduino-esp32 releases don't need it for a plain compile — it only matters for `pio run -t
; buildfs`, generating the LittleFS image for the "spiffs" data partition). Blanking it here
; overrides the inherited forced pin rather than appending to it. On an unrestricted machine this
; override is unnecessary; if you need `buildfs` here, install mklittlefs some other way first.
platform_packages =
; esp32_common.ini's own custom_component_remove list has two real upstream bugs that leave
; espressif/network_provisioning and espressif/rmaker_common in the resolved ESP-IDF Component
; Manager dependency graph even though nothing on this board (or upstream Meshtastic in general,
; outside its optional RainMaker integration) needs ESP RainMaker: network_provisioning's removal
; line is commented out entirely in esp32_common.ini, and rmaker_common is listed there without
; its "espressif/" owner prefix, so it never matches the real dependency key. Re-declaring the
; full list here (inherited + those two fixed) also drops espressif/cbor, which is *also*
; RainMaker/Insights-only — it sits inside the same "RainMaker Start"..."RainMaker End" block in
; arduino-esp32's own idf_component.yml, and nothing else in this build references it. This isn't
; a network-restriction workaround (unlike platform= above) -- it's a real fix that trims three
; genuinely-unused components from every build of this env, restricted network or not, so it's
; worth keeping even on a machine with full access to Espressif's component registry.
custom_component_remove =
  ${esp32_common.custom_component_remove}
  espressif/network_provisioning
  espressif/rmaker_common
  espressif/cbor
board_build.partitions = variants/esp32s3/m5stack_cardputer_adv_dualmesh/partitions_dualmesh.csv
board_build.filesystem_partition = spiffs
build_flags =
  ${env:m5stack-cardputer-adv.build_flags}
  -I variants/esp32s3/m5stack_cardputer_adv_dualmesh
  -D DUALMESH
  -D USERPREFS_CONFIG_LORA_REGION=meshtastic_Config_LoRaConfig_RegionCode_US
; NOTE: dualmesh_ota.h is included directly from src/main.cpp (see
; 0001-add-return-to-launcher-hook.patch) rather than force-included here via
; -include. A global -include gets applied even to plain-C and ESP-IDF-internal
; C++ translation units that don't have Arduino.h on their include path (e.g.
; cxx_exception_stubs.cpp in the esp-idf/cxx component), which breaks the
; build. -I above is still needed so the quoted #include "dualmesh_ota.h" in
; main.cpp resolves.

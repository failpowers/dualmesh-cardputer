; DualMesh launcher — boot-picker for Meshtastic / MeshCore on M5Stack Cardputer ADV.
; Lives in the "factory" slot of ../partitions_dualmesh.csv and is what boots by default
; (blank otadata => ROM bootloader falls back to the factory partition automatically).

[env:cardputer_adv_launcher]
; platform points at the pioarduino community fork of platform-espressif32, not the
; PlatformIO-registry-hosted "espressif32" name — pioarduino resolves every package (toolchain,
; framework, tools) to a direct GitHub release URL instead of going through registry.platformio.org.
; This is what actually made a from-scratch build possible in a network-restricted environment;
; Exact commit and library pins below match the verified launcher build.
platform = https://github.com/pioarduino/platform-espressif32.git#2959e98a2750832bca32fd2f849c0c274a4cdd63
board = m5stack-stamps3      ; same underlying module Meshtastic's own m5stack-cardputer-adv env uses
framework = arduino
board_build.partitions = ../partitions_dualmesh.csv
board_build.app_partition_name = factory
board_build.filesystem = littlefs
board_build.filesystem_partition = spiffs
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=2
; lib_deps point at GitHub directly rather than PlatformIO Library Registry names, for the same
; registry-access reason as `platform` above.
lib_deps =
  https://github.com/adafruit/Adafruit_BusIO.git#3b8364267c3ee6e16bad91bc2101aefbd5b5915f
  https://github.com/adafruit/Adafruit-GFX-Library.git#978b9f83edb0a335dbd996753a4a865137f325db
  https://github.com/adafruit/Adafruit-ST7735-Library.git#d568339f957380ceb05dda57f6712c2704a6394f
  https://github.com/adafruit/Adafruit_TCA8418.git#df1319acbe1f250b74d155c3535c177a20854030
  https://github.com/adafruit/Adafruit_Seesaw.git#829c4ecc056b130d73394d88fa4bf7de2ccbed5d
monitor_speed = 115200
upload_speed = 921600

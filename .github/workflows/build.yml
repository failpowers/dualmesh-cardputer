name: Build DualMesh firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Test packaging and installer (no hardware)
        run: python -m unittest discover -s tests -v
      - name: Build pinned sources and package fresh install
        run: python scripts/build.py --work-dir .build --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dualmesh-cardputer-adv-bin
          path: dist/
          retention-days: 90
